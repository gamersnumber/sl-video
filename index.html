<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: black; }
        .wrapper {
            position: relative;
            padding-bottom: 56.25%; /* This equals 16:9 ratio */
            height: 0;
            overflow: hidden;
        }
        /* Use padding-bottom: 75%; if you want 4:3 ratio */

        .wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=PL2AurSMq2mklYE1m3BFTHRZDDAV_lqtK7&autoplay=1&mute=1" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
</body>
</html>
