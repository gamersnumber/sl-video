<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: black; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
<iframe id="myPlayer" allow="encrypted-media" allowfullscreen></iframe>

    <script>
        // Reads "?v=YOUR_ID" from the URL, or defaults to 2MRLKI6cJUY if empty
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        document.getElementById('myPlayer').src = 'https://www.youtube-nocookie.com/embed/' + videoId;
    </script>

    
</body>
</html>
