<!DOCTYPE html>
<html>
<body>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Videos</title>
</head>
    
<iframe id="myPlayer" allow="encrypted-media" allowfullscreen></iframe>

<div id="video-wrapper" class="video-container">Loading latest videos...</div>

<script>
        // REPLACE THIS with your actual YouTube Channel ID (starts with UC)
        const channelId = 'UCx4iXLIKr4MPyHRMd5dXPbA'; 

        const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const wrapper = document.getElementById('video-wrapper');
                wrapper.innerHTML = ''; // Clear loading text

                // Grab only the first 3 latest videos
                const latestVideos = data.items.slice(0, 3);

                latestVideos.forEach(item => {
                    // Extract Video ID from YouTube link URL
                    const videoId = item.link.split('v=')[1];

                    // Create iframe element
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}`;
                    iframe.allowFullscreen = true;
                    
                    wrapper.appendChild(iframe);
                });
            })
            .catch(error => {
                document.getElementById('video-wrapper').innerText = 'Failed to load videos.';
                console.error('Error fetching YouTube RSS:', error);
            });
    </script>

</body>
</html>
